name: Build & Release

# Triggered when you push a tag like: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─── Windows build ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r SpotdlRip/requirements.txt pyinstaller
          pip install -U "yt-dlp" --pre

      - name: Download FFmpeg (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ffexe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffexe.FullName ffmpeg.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force
          if (-not (Test-Path ffmpeg.exe)) { throw "ffmpeg.exe missing after download" }
          $size = (Get-Item ffmpeg.exe).Length
          if ($size -lt 5MB) { throw "ffmpeg.exe too small ($size bytes) — download likely failed" }
          Write-Host "OK: ffmpeg.exe = $size bytes"

      - name: Build exe
        run: pyinstaller musicdl.spec --clean

      - name: Smoke test exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/MusicDL.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          $logDir = "$env:APPDATA\MusicDL"
          $logFile = "$logDir\music-dl.log"
          if (Test-Path $logFile) {
            Write-Host "=== Last 40 lines of log ==="
            Get-Content $logFile -Tail 40
          }
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed (exit code $($proc.ExitCode))"
          }
          Write-Host "Smoke test PASSED"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "dist/MusicDL.exe"

  # ─── macOS build ──────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r SpotdlRip/requirements.txt pyinstaller
          pip install -U "yt-dlp" --pre

      - name: Install FFmpeg
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" ffmpeg
          file ffmpeg
          ls -lh ffmpeg

      - name: Generate .icns from icon_dark.png
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          sips -z 16   16   frontend/icon_dark.png --out icon.iconset/icon_16x16.png
          sips -z 32   32   frontend/icon_dark.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32   32   frontend/icon_dark.png --out icon.iconset/icon_32x32.png
          sips -z 64   64   frontend/icon_dark.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128  128  frontend/icon_dark.png --out icon.iconset/icon_128x128.png
          sips -z 256  256  frontend/icon_dark.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256  256  frontend/icon_dark.png --out icon.iconset/icon_256x256.png
          sips -z 512  512  frontend/icon_dark.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512  512  frontend/icon_dark.png --out icon.iconset/icon_512x512.png
          cp frontend/icon_dark.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o frontend/icon.icns
          ls -lh frontend/icon.icns

      - name: Build .app
        run: pyinstaller musicdl-mac.spec --clean

      - name: Smoke test .app
        run: |
          set -e
          ./dist/MusicDL.app/Contents/MacOS/MusicDL --selftest
          rc=$?
          logFile="$HOME/Library/Application Support/MusicDL/music-dl.log"
          if [ -f "$logFile" ]; then
            echo "=== Last 50 lines of log ==="
            tail -n 50 "$logFile"
          fi
          if [ $rc -ne 0 ]; then
            echo "Smoke test failed (exit code $rc)"
            exit $rc
          fi
          echo "Smoke test PASSED"

      - name: Zip .app bundle
        run: cd dist && zip -r -y "MusicDL macOS.zip" "MusicDL.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "dist/MusicDL macOS.zip"

  # ─── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MusicDL ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            windows/MusicDL.exe
            macos/MusicDL macOS.zip
