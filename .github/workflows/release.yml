name: Build & Release

# Triggered when you push a tag like: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─── Windows build ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r SpotdlRip/requirements.txt pyinstaller

      - name: Download FFmpeg (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ffexe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffexe.FullName ffmpeg.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Build exe
        run: pyinstaller musicdl.spec --clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "dist/MUSIC DL.exe"

  # ─── macOS build ──────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r SpotdlRip/requirements.txt pyinstaller

      - name: Download FFmpeg (macOS)
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" ffmpeg

      - name: Build .app
        run: pyinstaller musicdl-mac.spec --clean

      - name: Zip .app bundle
        run: cd dist && zip -r "MUSIC DL macOS.zip" "MUSIC DL.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "dist/MUSIC DL macOS.zip"

  # ─── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MUSIC DL ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            windows/MUSIC DL.exe
            macos/MUSIC DL macOS.zip
